name: discloud

services:
  backend:
    image: ghcr.io/mewisme/dcbe:beta
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    user: 1000:1000
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DISCLOUD_HTTP_LISTEN_ADDRESS: ":8080"
      DISCLOUD_HTTP_CORS_ALLOWED_ORIGINS: ${DISCLOUD_HTTP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DISCLOUD_DATABASE_DSN: postgres://discloud:discloud@postgres:5432/discloud?sslmode=disable
    ports:
      - 8080:8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - network

  web:
    image: ghcr.io/mewisme/dcfe:beta
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: web
    restart: unless-stopped
    environment:
      DISCLOUD_API_URL: http://backend:8080
      DISCLOUD_PUBLIC_API_URL: ${DISCLOUD_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - 3000:3000
    depends_on:
      - backend
    networks:
      - network

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: discloud
      POSTGRES_USER: discloud
      POSTGRES_PASSWORD: discloud
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U discloud -d discloud
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - network

networks:
  network:
    driver: bridge

volumes:
  postgres-data: