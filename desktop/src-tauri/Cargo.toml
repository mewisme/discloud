[package]
name = "discloud-desktop"
version = "0.0.1"
description = "DisCloud desktop client"
authors = ["Nguyen Mau Minh"]
edition = "2021"
license = "MIT"
repository = "https://github.com/mewisme/discloud"

[lib]
name = "discloud_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
