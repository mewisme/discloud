name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DISCLOUD_BACKEND_DOCKER_IMAGE: ghcr.io/mewisme/discloud-backend

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: discloud
          POSTGRES_USER: discloud
          POSTGRES_PASSWORD: discloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U discloud -d discloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DISCLOUD_TEST_DATABASE_DSN: postgres://discloud:discloud@localhost:5432/discloud?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build binary
        run: go build ./cmd/discloud

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Build local container
        run: docker build --pull -t discloud-backend:test .

      - name: Build release container target
        shell: bash
        run: |
          context="$(mktemp -d)"
          trap 'rm -rf "$context"' EXIT

          mkdir -p "$context/linux/amd64"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "$context/linux/amd64/discloud" \
            ./cmd/discloud

          docker build \
            --pull \
            --target release \
            --build-arg TARGETPLATFORM=linux/amd64 \
            --file Dockerfile \
            --tag discloud-backend:release-test \
            "$context"

      - name: Validate Compose
        shell: bash
        run: |
          cp .env.example .env
          docker compose config >/dev/null

      - name: Add job summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Backend"
            echo
            echo "| Result | Value |"
            echo "| --- | --- |"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Commit | [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}) |"
            echo "| Checks | gofmt, go vet, race tests, binary build, GoReleaser config, Docker images, Compose config |"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          package-json-file: package.json
          cache-dependency-path: pnpm-lock.yaml
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API contracts
        run: pnpm api:types:check

      - name: Type check API package
        run: pnpm api:typecheck

      - name: Type check shared package
        run: pnpm shared:typecheck

      - name: Type check UI package
        run: pnpm ui:typecheck

      - name: Type check App UI package
        run: pnpm app-ui:typecheck

      - name: Validate updater channels
        run: node scripts/tauri-updater-setup.js --check

      - name: Lint desktop
        run: pnpm desktop:lint

      - name: Test desktop
        run: pnpm desktop:test

      - name: Type check desktop
        run: pnpm desktop:typecheck

      - name: Build desktop frontend
        run: pnpm desktop:build

      - name: Generate Next.js types
        run: pnpm --filter @discloud/web typegen

      - name: Lint web
        run: pnpm web:lint

      - name: Type check web
        run: pnpm web:typecheck

      - name: Test web
        run: pnpm web:test

      - name: Build web
        run: pnpm web:build

      - name: Build local container
        run: docker build --pull --file web/Dockerfile --tag discloud-frontend:test .

      - name: Add job summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Web"
            echo
            echo "| Result | Value |"
            echo "| --- | --- |"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Commit | [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}) |"
            echo "| Checks | API contracts, package and app type checks, lint, tests, builds, Docker image |"
          } >> "$GITHUB_STEP_SUMMARY"

  desktop-rust:
    name: Desktop Rust
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache

    defaults:
      run:
        working-directory: desktop/src-tauri

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
        working-directory: .

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: desktop-x86_64-unknown-linux-gnu
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked

      - name: Add job summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Desktop Rust"
            echo
            echo "| Result | Value |"
            echo "| --- | --- |"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Commit | [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}) |"
            echo "| Checks | cargo fmt, cargo check, cargo test |"
          } >> "$GITHUB_STEP_SUMMARY"
