name: Release verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Verify backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: discloud
          POSTGRES_USER: discloud
          POSTGRES_PASSWORD: discloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U discloud -d discloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DISCLOUD_TEST_DATABASE_DSN: postgres://discloud:discloud@localhost:5432/discloud?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Build release binary
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build \
            -trimpath \
            -ldflags="-s -w" \
            -o /tmp/discloud \
            ./cmd/discloud

      - name: Add job summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Verify backend"
            echo
            echo "| Result | Value |"
            echo "| --- | --- |"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Tag | \`${GITHUB_REF_NAME}\` |"
            echo "| Checks | gofmt, go vet, race tests, GoReleaser config, release binary build |"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Verify web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          package-json-file: package.json
          cache-dependency-path: pnpm-lock.yaml
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API contracts
        run: pnpm api:types:check

      - name: Type check API package
        run: pnpm api:typecheck

      - name: Type check shared package
        run: pnpm shared:typecheck

      - name: Type check UI package
        run: pnpm ui:typecheck

      - name: Type check App UI package
        run: pnpm app-ui:typecheck

      - name: Generate Next.js types
        run: pnpm --filter @discloud/web typegen

      - name: Lint web
        run: pnpm web:lint

      - name: Type check web
        run: pnpm web:typecheck

      - name: Test web
        run: pnpm web:test

      - name: Build web
        run: pnpm web:build

      - name: Add job summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Verify web"
            echo
            echo "| Result | Value |"
            echo "| --- | --- |"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Tag | \`${GITHUB_REF_NAME}\` |"
            echo "| Checks | API contracts, type checks, lint, tests, web build |"
          } >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Verify desktop
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          package-json-file: package.json
          cache-dependency-path: pnpm-lock.yaml
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: desktop-x86_64-unknown-linux-gnu
          cache-on-failure: true

      - name: Validate updater channels
        run: node scripts/tauri-updater-setup.js --check

      - name: Lint desktop
        run: pnpm desktop:lint

      - name: Type check desktop
        run: pnpm desktop:typecheck

      - name: Build desktop frontend
        run: pnpm desktop:build

      - name: Check Rust formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      - name: Check Rust
        working-directory: desktop/src-tauri
        run: cargo check --locked

      - name: Test Rust
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Add job summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Verify desktop"
            echo
            echo "| Result | Value |"
            echo "| --- | --- |"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Tag | \`${GITHUB_REF_NAME}\` |"
            echo "| Checks | updater validation, frontend lint/type checks/build, Rust format/check/test |"
          } >> "$GITHUB_STEP_SUMMARY"
