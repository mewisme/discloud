name: Release web standalone

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build web standalone payload
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          package-json-file: package.json
          cache-dependency-path: pnpm-lock.yaml
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted --filter @discloud/web...

      - name: Build web standalone
        run: pnpm web:build

      - name: Materialize portable payload
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/discloud-web"
          node scripts/materialize-next-standalone.cjs web/.next/standalone "$stage"
          mkdir -p "$stage/web/.next" "$stage/web/public"
          cp -a web/.next/static "$stage/web/.next/static"
          cp scripts/managed-web-runtime.cjs "$stage/managed-web-runtime.cjs"
          printf '%s\n' "${{ inputs.version }}" > "$stage/discloud-web-version.txt"
          if [[ -d web/public ]]; then cp -a web/public/. "$stage/web/public/"; fi
          test -f "$stage/managed-web-runtime.cjs"
          test -f "$stage/discloud-web-version.txt"
          test -f "$stage/web/server.js"
          test -d "$stage/web/.next/server"
          test -d "$stage/web/.next/static"
          find "$stage/node_modules" -type d -path '*/@img/sharp-*' -prune -exec rm -rf {} +
          find "$stage/node_modules/.pnpm" -mindepth 1 -maxdepth 1 -type d -name '@img+sharp-*' -exec rm -rf {} +
          if find "$stage" -type f \( -name '*.node' -o -name '*.dll' -o -name '*.dylib' -o -name '*.exe' -o -name '*.so' -o -name '*.so.*' \) -print -quit | grep -q .; then
            echo "Portable standalone payload unexpectedly contains platform-specific native files." >&2
            find "$stage" -type f \( -name '*.node' -o -name '*.dll' -o -name '*.dylib' -o -name '*.exe' -o -name '*.so' -o -name '*.so.*' \) -print >&2
            exit 1
          fi

      - name: Upload portable payload
        uses: actions/upload-artifact@v4
        with:
          name: web-standalone-payload
          path: ${{ runner.temp }}/discloud-web
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release web standalone (${{ matrix.name }})
    needs:
      - build
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-24.04
            os: linux
            arch: amd64
          - name: Linux ARM64
            platform: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - name: Windows x64
            platform: windows-latest
            os: windows
            arch: amd64
          - name: macOS Apple Silicon
            platform: macos-15
            os: darwin
            arch: arm64
          - name: macOS Intel
            platform: macos-15-intel
            os: darwin
            arch: amd64
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download portable payload
        uses: actions/download-artifact@v4
        with:
          name: web-standalone-payload
          path: ${{ runner.temp }}/discloud-web

      - name: Package and smoke test managed web runtime
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="${{ inputs.version }}"
          archive="discloud-web_${version}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"
          stage="$RUNNER_TEMP/discloud-web"
          node_name="node"
          if [[ "${{ matrix.os }}" == "windows" ]]; then node_name="node.exe"; fi

          sharp_packages="$RUNNER_TEMP/sharp-packages"
          mkdir -p "$sharp_packages"
          mapfile -t sharp_specs < <(node - "$stage/node_modules/sharp/package.json" "${{ matrix.os }}" "${{ matrix.arch }}" <<'NODE'
          const fs = require("node:fs")
          const [packagePath, os, arch] = process.argv.slice(2)
          const pkg = JSON.parse(fs.readFileSync(packagePath, "utf8"))
          const platform = os === "windows" ? "win32" : os
          const cpu = arch === "amd64" ? "x64" : arch
          for (const name of [`@img/sharp-${platform}-${cpu}`, `@img/sharp-libvips-${platform}-${cpu}`]) {
            const version = pkg.optionalDependencies?.[name]
            if (version) console.log(`${name}@${version}`)
          }
          NODE
          )
          if (( ${#sharp_specs[@]} == 0 )); then
            echo "No sharp native packages resolved for ${{ matrix.os }}/${{ matrix.arch }}." >&2
            exit 1
          fi
          for spec in "${sharp_specs[@]}"; do
            pack_json="$(npm pack "$spec" --json --pack-destination "$sharp_packages")"
            pack_meta="$(node -e 'const item=JSON.parse(process.argv[1])[0]; process.stdout.write(`${item.name}|${item.filename}`)' "$pack_json")"
            IFS='|' read -r package_name package_file <<< "$pack_meta"
            destination="$stage/node_modules/$package_name"
            rm -rf "$destination"
            mkdir -p "$destination"
            tar -xzf "$sharp_packages/$package_file" -C "$destination" --strip-components=1
          done

          node -e 'require("node:fs").copyFileSync(process.execPath, process.argv[1])' "$stage/$node_name"
          if [[ "${{ matrix.os }}" != "windows" ]]; then chmod +x "$stage/$node_name"; fi

          test -f "$stage/$node_name"
          test -f "$stage/managed-web-runtime.cjs"
          test -f "$stage/discloud-web-version.txt"
          test -f "$stage/web/server.js"
          test -d "$stage/web/.next/server"
          test -d "$stage/web/.next/static"

          shutdown_file="$RUNNER_TEMP/discloud-web.shutdown"
          rm -f "$shutdown_file"
          HOSTNAME=127.0.0.1 \
          PORT=3100 \
          DISCLOUD_API_URL=http://127.0.0.1:8080 \
          DISCLOUD_PUBLIC_API_URL= \
          DISCLOUD_MANAGED_WEB_SHUTDOWN_FILE="$shutdown_file" \
            "$stage/$node_name" "$stage/managed-web-runtime.cjs" >"$RUNNER_TEMP/discloud-web.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT

          ready=false
          for _ in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3100/healthz >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            cat "$RUNNER_TEMP/discloud-web.log"
            exit 1
          fi

          printf 'shutdown\n' > "$shutdown_file"
          for _ in {1..40}; do
            if [[ ! -f "$shutdown_file" ]] && ! kill -0 "$server_pid" >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          if kill -0 "$server_pid" >/dev/null 2>&1; then
            cat "$RUNNER_TEMP/discloud-web.log"
            exit 1
          fi
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT

          tar -C "$stage" -czf "$archive" .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload standalone runtime
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.archive }}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Add job summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Release web standalone — ${{ matrix.name }}"
            echo
            echo "| Result | Value |"
            echo "| --- | --- |"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Tag | \`${GITHUB_REF_NAME}\` |"
            echo "| Output | Self-contained Node.js 24 + Next.js managed runtime |"
          } >> "$GITHUB_STEP_SUMMARY"

  checksums:
    name: Release web standalone checksums
    needs:
      - release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download standalone runtimes
        shell: bash
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'discloud-web_*.tar.gz' --dir dist

      - name: Generate and upload checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum discloud-web_*.tar.gz > discloud-web-checksums.txt
          gh release upload "$GITHUB_REF_NAME" discloud-web-checksums.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Add job summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Release web standalone checksums"
            echo
            echo "| Result | Value |"
            echo "| --- | --- |"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Tag | \`${GITHUB_REF_NAME}\` |"
            echo "| Output | \`discloud-web-checksums.txt\` |"
          } >> "$GITHUB_STEP_SUMMARY"
