name: Release backend

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      make_latest:
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  DISCLOUD_BACKEND_DOCKER_IMAGE: ghcr.io/mewisme/discloud-backend

jobs:
  release:
    name: Release backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCLOUD_DOCKER_CHANNEL_TAG: ${{ inputs.channel == 'stable' && 'latest' || inputs.channel }}
          DISCLOUD_RELEASE_MAKE_LATEST: ${{ inputs.make_latest }}

      - name: Add job summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Release backend"
            echo
            echo "| Result | Value |"
            echo "| --- | --- |"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Tag | \`${GITHUB_REF_NAME}\` |"
            echo "| Channel | \`${{ inputs.channel }}\` |"
            echo "| Output | GoReleaser release and GHCR image |"
          } >> "$GITHUB_STEP_SUMMARY"
