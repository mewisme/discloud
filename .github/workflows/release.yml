name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/release-verify.yml
    permissions:
      contents: read

  release-info:
    name: Resolve release info
    needs:
      - verify
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.info.outputs.channel }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      make-latest: ${{ steps.info.outputs.make-latest }}
      version: ${{ steps.info.outputs.version }}
      updater-endpoints: ${{ steps.info.outputs.updater-endpoints }}

    steps:
      - name: Resolve tag, channel and updater endpoints
        id: info
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi

          case "$version" in
            *-alpha|*-alpha.*) channel="alpha" ;;
            *-beta|*-beta.*) channel="beta" ;;
            *-rc|*-rc.*) channel="rc" ;;
            *) channel="stable" ;;
          esac

          if [[ "$channel" == "stable" ]]; then
            prerelease="false"
            make_latest="true"
          else
            prerelease="true"
            make_latest="false"
          fi

          updater_endpoints="$(node -e '
            const latest = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/latest/download`;
            const channels = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/updater-channels`;
            process.stdout.write(JSON.stringify({
              stable: [`${latest}/latest.json`],
              rc: [`${channels}/rc.json`],
              beta: [`${channels}/beta.json`],
              alpha: [`${channels}/alpha.json`],
            }));
          ')"

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "make-latest=$make_latest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "updater-endpoints=$updater_endpoints" >> "$GITHUB_OUTPUT"

          echo "Release: $tag"
          echo "Version: $version"
          echo "Channel: $channel"

      - name: Add job summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Release info"
            echo
            echo "| Result | Value |"
            echo "| --- | --- |"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Tag | \`${GITHUB_REF_NAME}\` |"
            echo "| Release | \`${{ steps.info.outputs.version }}\` / \`${{ steps.info.outputs.channel }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  release-backend:
    name: Release backend
    needs:
      - release-info
    uses: ./.github/workflows/release-backend.yml
    permissions:
      contents: write
      packages: write
    with:
      channel: ${{ needs.release-info.outputs.channel }}
      make_latest: ${{ needs.release-info.outputs.make-latest }}

  release-web:
    name: Release web
    needs:
      - release-info
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      context: .
      file: web/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: dcfe
      cache-mode: max
      meta-images: ghcr.io/mewisme/discloud-frontend
      meta-tags: |
        type=raw,value=${{ github.ref_name }}
        type=raw,value=alpha,enable=${{ needs.release-info.outputs.channel == 'alpha' }}
        type=raw,value=beta,enable=${{ needs.release-info.outputs.channel == 'beta' }}
        type=raw,value=rc,enable=${{ needs.release-info.outputs.channel == 'rc' }}
        type=raw,value=latest,enable=${{ needs.release-info.outputs.channel == 'stable' }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  release-web-standalone:
    name: Release web standalone
    needs:
      - release-info
    uses: ./.github/workflows/release-web-standalone.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.release-info.outputs.version }}

  release-desktop:
    name: Release desktop
    needs:
      - release-info
      - release-backend
      - release-web-standalone
    uses: ./.github/workflows/release-desktop.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.release-info.outputs.version }}
      prerelease: ${{ needs.release-info.outputs.prerelease }}
      updater_endpoints: ${{ needs.release-info.outputs.updater-endpoints }}
    secrets: inherit

  publish-updater-channels:
    name: Publish updater channels
    needs:
      - release-info
      - release-desktop
    uses: ./.github/workflows/release-updater.yml
    permissions:
      contents: write
    with:
      channel: ${{ needs.release-info.outputs.channel }}
