name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DISCLOUD_BACKEND_DOCKER_IMAGE: ghcr.io/mewisme/dcbe
  DISCLOUD_FRONTEND_DOCKER_IMAGE: ghcr.io/mewisme/dcfe

jobs:
  verify-backend:
    name: Verify backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: discloud
          POSTGRES_USER: discloud
          POSTGRES_PASSWORD: discloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U discloud -d discloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DISCLOUD_TEST_DATABASE_DSN: postgres://discloud:discloud@localhost:5432/discloud?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Build local container
        run: docker build --pull -t dcbe:test .

      - name: Build release container target
        shell: bash
        run: |
          context="$(mktemp -d)"
          trap 'rm -rf "$context"' EXIT

          mkdir -p "$context/linux/amd64"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "$context/linux/amd64/discloud" \
            ./cmd/discloud

          docker build \
            --pull \
            --target release \
            --build-arg TARGETPLATFORM=linux/amd64 \
            --file Dockerfile \
            --tag dcbe:release-test \
            "$context"

  verify-web:
    name: Verify web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          package-json-file: web/package.json
          cache-dependency-path: web/pnpm-lock.yaml
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check API contracts
        working-directory: web
        run: pnpm api:types:check

      - name: Generate Next.js types
        working-directory: web
        run: pnpm next typegen

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Type check
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Build local container
        run: docker build --pull -t dcfe:test web

  release-backend:
    name: Release backend
    needs:
      - verify-backend
      - verify-web
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker channel tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME,,}"

          case "$tag" in
            *alpha*) channel="alpha" ;;
            *beta*) channel="beta" ;;
            *rc*) channel="rc" ;;
            *) channel="latest" ;;
          esac

          echo "DISCLOUD_DOCKER_CHANNEL_TAG=$channel" >> "$GITHUB_ENV"

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-web:
    name: Release web
    needs:
      - verify-backend
      - verify-web
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker channel tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME,,}"

          case "$tag" in
            *alpha*) channel="alpha" ;;
            *beta*) channel="beta" ;;
            *rc*) channel="rc" ;;
            *) channel="latest" ;;
          esac

          echo "DISCLOUD_DOCKER_CHANNEL_TAG=$channel" >> "$GITHUB_ENV"

      - name: Release
        shell: bash
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file web/Dockerfile \
            --tag "${DISCLOUD_FRONTEND_DOCKER_IMAGE}:${GITHUB_REF_NAME}" \
            --tag "${DISCLOUD_FRONTEND_DOCKER_IMAGE}:${DISCLOUD_DOCKER_CHANNEL_TAG}" \
            --push \
            web